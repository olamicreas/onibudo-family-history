<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="S6Nv4n0iA_NUbTFTJJedqNIdaTWiq4CcEP_l2ws9VP4" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onibudo Family History — Itan Idile Onibudo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html{
    scroll-behavior:smooth;
}
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:'Open Sans',sans-serif;
    background:#f5efe4;
    color:#2d2117;
    line-height:1.8;
    overflow-x:hidden;
}
/* HERO */
.hero{
    position:relative;
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.7)),
    url('IMG_6708.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}
/* Animated overlay glow */
.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at top right,
    rgba(212,175,55,.25),
    transparent 40%);
    animation:pulseGlow 6s infinite alternate;
}
@keyframes pulseGlow{
    from{
        opacity:.4;
        transform:scale(1);
    }
    to{
        opacity:.9;
        transform:scale(1.08);
    }
}
/* Glass effect text box */
.hero-content{
    position:relative;
    z-index:2;
    max-width:900px;
    padding:45px;
    border-radius:24px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
    0 8px 32px rgba(0,0,0,.35);
    animation:fadeUp 1.3s ease;
}
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.hero h1{
    font-family:'Cinzel',serif;
    font-size:72px;
    margin-bottom:12px;
    letter-spacing:3px;
    color:#fff;
    text-shadow:
    0 0 15px rgba(212,175,55,.4);
}
.hero h2{
    font-size:30px;
    color:#d4af37;
    margin-top:0;
    margin-bottom:25px;
}
.hero p{
    font-size:21px;
    color:#f4f4f4;
}
/* NAVIGATION */
nav{
    position:sticky;
    top:0;
    z-index:999;
    backdrop-filter:blur(12px);
    background:rgba(20,12,7,.75);
    padding:18px;
    text-align:center;
    border-bottom:
    1px solid rgba(255,255,255,.08);
}
nav a{
    color:#f8e8b0;
    text-decoration:none;
    margin:0 20px;
    font-weight:600;
    transition:.3s ease;
    position:relative;
}
nav a::after{
    content:'';
    position:absolute;
    width:0%;
    height:2px;
    left:0;
    bottom:-6px;
    background:#d4af37;
    transition:.3s;
}
nav a:hover::after{
    width:100%;
}
nav a:hover{
    color:#fff;
}
/* SECTIONS */
section{
    max-width:1150px;
    margin:auto;
    padding:90px 25px;
    animation:fadeSection linear;
    animation-timeline:view();
    animation-range:entry 0% cover 30%;
}
@keyframes fadeSection{
    from{
        opacity:0;
        transform:translateY(70px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
h2{
    font-family:'Cinzel',serif;
    color:#5e3d17;
    font-size:42px;
    border-bottom:3px solid #d4af37;
    display:inline-block;
    padding-bottom:10px;
    margin-bottom:35px;
}
/* QUOTE */
.quote{
    background:#fff7e3;
    border-left:6px solid #d4af37;
    padding:30px;
    margin:45px 0;
    font-style:italic;
    border-radius:14px;
    box-shadow:
    0 8px 24px rgba(0,0,0,.08);
    transition:.4s ease;
}
.quote:hover{
    transform:translateY(-5px);
}
/* CARDS */
.card-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(270px,1fr));
    gap:30px;
}
.card{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:
    0 10px 28px rgba(0,0,0,.08);
    transition:.4s ease;
    position:relative;
    overflow:hidden;
}
.card::before{
    content:'';
    position:absolute;
    inset:0;
    background:
    linear-gradient(
    135deg,
    rgba(212,175,55,.08),
    transparent);
    opacity:0;
    transition:.4s;
}
.card:hover::before{
    opacity:1;
}
.card:hover{
    transform:
    translateY(-12px)
    scale(1.02);
    box-shadow:
    0 18px 38px rgba(0,0,0,.15);
}
.card h3{
    color:#7a531f;
    margin-top:0;
}
/* TIMELINE */
.timeline{
    border-left:4px solid #b78b2c;
    padding-left:35px;
    position:relative;
}
.timeline-item{
    margin-bottom:45px;
    position:relative;
}
.timeline-item::before{
    content:'';
    position:absolute;
    left:-46px;
    top:6px;
    width:18px;
    height:18px;
    background:#d4af37;
    border-radius:50%;
    box-shadow:
    0 0 15px rgba(212,175,55,.6);
}
/* LISTS */
ul li{
    margin-bottom:14px;
}
/* FOOTER */
.footer{
    background:#1b120b;
    color:#d8c7a0;
    text-align:center;
    padding:65px 20px;
    margin-top:70px;
}
.footer p{
    margin:10px;
}
/* RESPONSIVE */
@media(max-width:768px){
.hero h1{
    font-size:46px;
}
.hero h2{
    font-size:24px;
}
.hero p{
    font-size:18px;
}
.hero-content{
    padding:30px;
}
nav a{
    margin:0 10px;
    font-size:14px;
}
h2{
    font-size:34px;
}
}
</style>
</head>
<body>
<div class="hero">
    <div class="hero-content">
        <h1>ONIBUDO FAMILY HISTORY</h1>
        <h2>Itan Idile Onibudo</h2>
        <p>
            Preserving the warrior heritage, lineage,
            culture, and historical legacy of the descendants
            of Olawolu Onibudo of Ibadanland.
        </p>
    </div>
</div>

    <a href="#origins">Origins</a>
    <a href="#warriors">Warrior Legacy</a>
    <a href="#settlements">Historic Compounds</a>
    <a href="#timeline">Timeline</a>
    <a href="#legacy">Legacy</a>
</nav>

</body>
</html>
